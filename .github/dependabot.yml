# Política de atualização (S-12): PRs semanais, agrupados, revisados como qualquer outro PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Dependências de runtime vão para o pacote publicado: um PR por atualização, revisado à parte.
    groups:
      # O OpenTelemetry versiona os pacotes juntos (api, sdk, exporters): atualizar um por vez deixa o exemplo
      # com versões incompatíveis entre si. Todos chegam numa PR só, inclusive em versão maior.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # O site (docs/) fica no TypeScript 5.9: o TypeDoc 0.28 só aceita até a 6.0. O pacote já está no 7, então
    # ignorar a versão maior só afeta o site. Remover quando o TypeDoc suportar o TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
